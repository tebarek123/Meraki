<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Merāki | Cart & Orders</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="cart.css" />
    <script defer src="script.js"></script>
  </head>
  <body class="cart-page">
    <header class="cart-header">
      <nav class="cart-nav">
        <div class="logo">
          <h1>Merāki</h1>
        </div>

        <label class="menu-icon" for="menu-toggle" aria-label="Toggle menu">
          <span class="bar"></span>
          <span class="bar"></span>
          <span class="bar"></span>
        </label>
        <input type="checkbox" id="menu-toggle" />

        <div class="nav-links">
          <a href="index.html">Home</a>
          <a href="index.html#products">Products</a>
          <a href="index.html#about">About</a>
          <a href="cart.html" class="cart-link">Cart <span id="cart-count" class="cart-count-badge">0</span></a>
        </div>
      </nav>
    </header>

    <main class="cart-main">
      <div class="container">
        <header class="header">
          <div>
            <h1>My Cart</h1>
            <p>Selected products and recent purchase history are saved for this browser session.</p>
          </div>
          <div class="badge" id="cart-summary-badge">0 items</div>
        </header>

        <section class="stats">
          <div class="stat-box">
            <div class="label">Items in cart</div>
            <div class="value" id="items-count">0</div>
          </div>
          <div class="stat-box">
            <div class="label">Cart subtotal</div>
            <div class="value" id="subtotal-value">$0.00</div>
          </div>
          <div class="stat-box">
            <div class="label">Order history</div>
            <div class="value" id="history-count">0</div>
          </div>
        </section>

        <div class="cart-layout">
          <section class="section cart-section">
            <div class="section-head">
              <h2>Cart Items</h2>
              <span class="pill" id="cart-pill">0 items</span>
            </div>
            <div id="cart-items" class="cart-items"></div>
          </section>

          <aside class="summary-panel">
            <h2>Order Summary</h2>
            <div class="summary-row">
              <span>Subtotal</span>
              <strong id="subtotal">$0.00</strong>
            </div>
            <div class="summary-row">
              <span>Shipping</span>
              <strong id="shipping">$0.00</strong>
            </div>
            <div class="summary-row total-row">
              <span>Total</span>
              <strong id="total">$0.00</strong>
            </div>

            <form id="payment-form" class="payment-form">
              <label>
                Bank transfer transaction number
                <input type="text" id="transaction-number" name="transactionNumber" placeholder="e.g. 123456789" required />
              </label>

              <label>
                Upload transfer screenshot
                <input type="file" id="payment-proof" name="paymentProof" accept="image/*" required />
              </label>

              <div id="proof-preview" class="proof-preview hidden"></div>
            </form>

            <button id="checkout-btn" type="button" class="checkout-btn">Place Order</button>
          </aside>
        </div>

        <section class="section">
          <div class="section-head">
            <h2>Order History</h2>
            <span class="pill" id="history-pill">0 orders</span>
          </div>
          <div id="order-history" class="history-list"></div>
        </section>
      </div>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </body>
</html>
